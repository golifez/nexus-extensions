name: Release DbCore extension

on:
  push:
    tags:
      - 'extension/dbcore/v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG##*/}"
          VERSION="${VERSION#v}"
          make -C extensions/dbcore package VERSION="$VERSION" OS="${{ matrix.os }}" ARCH="${{ matrix.arch }}"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbcore-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/dbcore/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dbcore-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
